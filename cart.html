<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light"){document.documentElement.setAttribute("data-theme",t);}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storefront — Cart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-bar">
    <a href="index.html" class="logo">Store<span>front</span></a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="shop.html">Categories</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
    <div class="header-actions">
      <button type="button" class="icon-btn theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <form class="header-search" id="headerSearchForm" action="shop.html" method="get">
        <input type="text" name="q" id="header-search-input" placeholder="Search products…" aria-label="Search products">
      </form>
      <button type="button" class="icon-btn search-toggle" id="searchToggle" aria-label="Search" title="Search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
      </button>
      <a href="account.html" class="icon-btn" title="Account" aria-label="Account">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      </a>
      <a href="cart.html" class="icon-btn" title="Cart" aria-label="Cart">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        <span class="cart-count">3</span>
      </a>
      <button class="nav-toggle" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<div class="wrap" style="padding-top:40px;">
  <p class="eyebrow">Step 1 of 2</p>
  <h1 style="font-size:30px;margin:8px 0 32px;">Your cart</h1>
</div>

<div class="wrap cart-layout" style="padding-top:0;">
  <div class="receipt" id="cart-lines"></div>

  <aside class="summary-card">
    <h3 style="font-size:16px;margin-bottom:16px;">Order summary</h3>
    <div class="promo-row">
      <input type="text" placeholder="Promo code" id="promo-code" style="padding:10px 12px;border:1px solid var(--line);border-radius:3px;font-size:13px;">
      <button class="btn btn-outline">Apply</button>
    </div>
    <div class="summary-row"><span>Subtotal</span><span id="cart-subtotal">₦0</span></div>
    <div class="summary-row"><span>Delivery</span><span id="cart-delivery">₦0</span></div>
    <div class="summary-row total"><span>Total</span><span id="cart-total">₦0</span></div>
    <a href="checkout.html" class="btn btn-primary btn-block" id="checkout-link" style="margin-top:18px;">Proceed to checkout</a>
    <div class="trust-item" style="margin-top:14px;justify-content:center;">
      <span class="seal" style="width:22px;height:22px;">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </span>
      Secure, encrypted checkout
    </div>
  </aside>
</div>

<footer class="site-footer" id="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="script.js"></script>
</body>
</html>
