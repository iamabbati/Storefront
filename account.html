<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light"){document.documentElement.setAttribute("data-theme",t);}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storefront — Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-bar">
    <a href="index.html" class="logo">Store<span>front</span></a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="shop.html">Categories</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
    <div class="header-actions">
      <button type="button" class="icon-btn theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <form class="header-search" id="headerSearchForm" action="shop.html" method="get">
        <input type="text" name="q" id="header-search-input" placeholder="Search products…" aria-label="Search products">
      </form>
      <button type="button" class="icon-btn search-toggle" id="searchToggle" aria-label="Search" title="Search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
      </button>
      <a href="cart.html" class="icon-btn" title="Cart" aria-label="Cart">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        <span class="cart-count">3</span>
      </a>
    </div>
  </div>
</header>

<div class="account-panel">
  <div class="tab-row">
    <button class="tab-btn active" data-tab="login">Log in</button>
    <button class="tab-btn" data-tab="signup">Sign up</button>
    <span class="tab-underline"></span>
  </div>

  <form class="auth-form active" id="login-form">
    <div class="field"><label for="login-email">Email address</label><input id="login-email" type="email" placeholder="you@example.com"></div>
    <div class="field"><label for="login-pass">Password</label><input id="login-pass" type="password" placeholder="••••••••"></div>
    <button type="submit" class="btn btn-primary btn-block">Log in</button>
    <p id="login-status" style="font-size:12.5px;text-align:center;margin-top:12px;min-height:16px;"></p>
    <p style="font-size:12px;color:var(--ink-soft);text-align:center;margin-top:2px;">Forgot your password?</p>
  </form>

  <form class="auth-form" id="signup-form">
    <div class="field"><label for="su-name">Full name</label><input id="su-name" type="text" placeholder="Ishaq Musa"></div>
    <div class="field"><label for="su-email">Email address</label><input id="su-email" type="email" placeholder="you@example.com"></div>
    <div class="field"><label for="su-pass">Password</label><input id="su-pass" type="password" placeholder="••••••••"></div>
    <button type="submit" class="btn btn-primary btn-block">Create account</button>
    <p id="signup-status" style="font-size:12.5px;text-align:center;margin-top:12px;min-height:16px;"></p>
    <p style="font-size:11.5px;color:var(--ink-soft);text-align:center;margin-top:2px;">Your data is encrypted and never shared with third parties.</p>
  </form>

  <div class="auth-form" id="account-logged-in" style="display:none;text-align:center;padding:8px 0;">
    <p style="font-size:13px;color:var(--ink-soft);margin-bottom:4px;">Signed in as</p>
    <p id="account-email" style="font-weight:600;font-size:16px;margin-bottom:24px;word-break:break-all;"></p>
    <button type="button" class="btn btn-outline btn-block" id="logout-btn">Log out</button>
  </div>
</div>

<footer class="site-footer" id="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="script.js"></script>
</body>
</html>
